# CI del Sistema de Posgrado UTN FRLP (US-TECH-001).
#
# Corre en cada push y PR a develop y main. Los nombres de los jobs (`backend` y `frontend`) son
# fijos: son los checks obligatorios de la protección de develop y main.
# Sin `paths:` a propósito: con checks obligatorios, un PR que no toca el back quedaría esperando
# un check que nunca corre.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Los mismos datos que los defaults de src/shared/config.py: no hace falta pasar las URLs.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgrado_user
          POSTGRES_PASSWORD: postgrado_dev_password
          POSTGRES_DB: postgrado_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgrado_user -d postgrado_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # config.py no tiene default para el secreto. Este solo vale para el CI, no es uno real.
      JWT_SECRET: secreto-solo-para-el-ci-de-32-o-mas-caracteres
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Migraciones
        run: uv run alembic upgrade head

      # Falla si alguien cambió un modelo sin su migración.
      - name: Modelos sin migración
        run: uv run alembic check

      # La cobertura mínima (70%) sale de fail_under en pyproject.toml.
      - name: Tests con cobertura
        run: uv run pytest --cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
