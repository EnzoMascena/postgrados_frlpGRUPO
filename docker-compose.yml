# Entorno de desarrollo del Sistema de Posgrado UTN FRLP.
#
# Por ahora solo la base y MailHog: sirven para correr el back y los tests en tu máquina.
#   docker compose up -d db mailhog
#   docker compose down        # baja todo, conserva la base
#   docker compose down -v     # baja todo y borra la base (para empezar de cero)
#
# Fran suma los servicios `backend` y `frontend` en F1 (US-TECH-001).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP: a donde manda el back
      - "8025:8025" # interfaz web: http://localhost:8025

volumes:
  pgdata:
