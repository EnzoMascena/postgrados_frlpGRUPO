[project]
name = "posgrado-backend"
version = "0.1.0"
description = "API del Sistema de Posgrado (UTN FRLP): FastAPI + SQLModel + PostgreSQL en 3 capas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.10,<4",
    "email-validator>=2.3.0",
    "fastapi>=0.149.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pwdlib[bcrypt]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff: linter + formatter (NFR-M03, PEP 8) ──────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# El largo de línea lo resuelve `ruff format`; E501 solo duplicaría avisos.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `= Depends(...)` en los parámetros es el estilo de FastAPI que usa la cátedra.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    # Las guardas de core/dependencies.py: Depends(require_role(Rol.X)) en cada ruta.
    "app.core.dependencies.require_role",
    "app.core.dependencies.require_legajo_propio",
    "app.core.dependencies.require_seminario_propio",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# La carpeta alembic/ (migraciones) no es el paquete: alembic es de terceros.
known-third-party = ["alembic"]

# ── Pytest (módulo 07) ─────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib: cada módulo tiene su propio test_reglas.py y los nombres no chocan.
addopts = "--import-mode=importlib"
filterwarnings = [
    # Starlette 1.x sugiere httpx2 para el TestClient; el stack del equipo usa httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# ── Cobertura: `uv run pytest --cov` (DoD: 70 % o más) ────────
[tool.coverage.run]
source = ["app.core", "app.auth"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
